name: CoSeph.Core.Combat CI

# CoSeph.Core.Combat depends on nothing but the .NET SDK, so this needs no
# cross-repo checkout and can run on every push.
#
# Work arrives on `testing` and reaches `main` only by passing this suite, so a
# commit on `main` is one the tests have run green. A red run leaves `main`
# exactly where it was.
on:
  push:
    branches: [ testing ]
  pull_request:
    branches: [ main, testing ]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  tests:
    name: CoSeph.Core.Combat

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run CoSeph.Core.Combat tests
        run: dotnet test Tests/CoSeph.Core.Combat.Tests.csproj --verbosity normal

  promote:
    name: Promote to main

    needs: tests
    # a green suite is the only thing that moves main, and only from a real push -
    # a pull_request run tests a merge commit that does not exist on either branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # full history: a shallow clone cannot be pushed from
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # fast-forward only, since the two branches share one history - a push that
      # is rejected means they have diverged, which wants a person rather than a
      # retry. Pushing as GITHUB_TOKEN does not start another run, so this cannot
      # loop back into itself
      - name: Fast-forward main
        run: git push origin HEAD:main
